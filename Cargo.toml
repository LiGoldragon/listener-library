[package]
name = "listener-library"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/listener-library"
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "nexus/datom", "translator/datom", "signal/datom"]

[dependencies]
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
nexus = { git = "https://github.com/LiGoldragon/nexus", rev = "681a99ba307acd9cce6d5c120846072f1cedd814", default-features = false }
translator = { git = "https://github.com/LiGoldragon/translator", rev = "cb4f6f4e5b3ef07f41d749e669dda58a6bcbf585", default-features = false }
# Registry feature closure: Cargo.nix must materialize the Nexus transitives.
# Removing any carrier below makes the aligned base's edge check refuse.
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro", "channel", "io", "sink"] }
futures-channel = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
mio = { version = "1.2", features = ["log"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time", "tracing"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "2999292dc67c8608e54d32c333c550b29153cbff" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
